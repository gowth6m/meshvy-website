<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#011627}
  #og{
    position:relative; width:1200px; height:630px; overflow:hidden;
    background:#011627;
    font-family:"Host Grotesk",system-ui,sans-serif; color:#d6deeb;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:64px 72px;
  }
  #og::before{
    content:""; position:absolute; inset:0;
    background-image:radial-gradient(circle at 1px 1px, rgba(126,151,179,.17) 1px, transparent 0);
    background-size:28px 28px;
  }
  #og::after{
    content:""; position:absolute; left:-5%; right:-5%; bottom:-30%; height:75%;
    background:radial-gradient(ellipse 55% 60% at 50% 70%, rgba(100,255,218,.26), transparent 70%);
    filter:blur(70px);
  }
  .row{position:relative; z-index:1}
  .brand{display:flex; align-items:center; gap:14px}
  .brand svg{width:38px;height:38px}
  .brand span{font-size:27px;font-weight:600;letter-spacing:-.03em}
  h1{
    font-size:82px; line-height:.95; font-weight:600; letter-spacing:-.042em;
    max-width:16ch; color:#fff;
  }
  .lede{margin-top:26px; font-size:25px; color:#7e97b3; max-width:30ch; line-height:1.4}
  .foot{display:flex; align-items:center; justify-content:space-between; gap:24px}
  .cmd{
    font-family:"JetBrains Mono",ui-monospace,monospace; font-size:16px; color:#d6deeb;
    background:#082438; border:1px solid #1d3b53; border-radius:12px; padding:13px 18px;
  }
  .cmd b{color:#64ffda;font-weight:400;margin-right:10px}
  .meta{
    font-family:"JetBrains Mono",ui-monospace,monospace; font-size:14px;
    letter-spacing:.14em; text-transform:uppercase; color:#7e97b3; white-space:nowrap;
  }
</style>
<div id="og">
  <div class="row brand">
    <svg viewBox="2 4 44 40" fill="none">
      <path d="M8 38V10L24 28L40 10V38M8 38L24 28" stroke="#d6deeb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8" cy="10" r="3.4" fill="#d6deeb"/><circle cx="40" cy="10" r="3.4" fill="#d6deeb"/>
      <circle cx="8" cy="38" r="3.4" fill="#d6deeb"/><circle cx="40" cy="38" r="3.4" fill="#d6deeb"/>
      <circle cx="24" cy="28" r="4.2" fill="#64ffda"/>
    </svg>
    <span>Meshvy</span>
  </div>

  <div class="row">
    <h1>The infinite canvas for orchestrating AI agents</h1>
    <p class="lede">One branch across every repo you pick, an agent with its own terminal on each.</p>
  </div>

  <div class="row foot">
    <div class="cmd"><b>$</b>gh api repos/gowth6m/meshvy/&hellip;/install.sh | bash</div>
    <div class="meta">macOS 14+ &middot; Claude Code</div>
  </div>
</div>
